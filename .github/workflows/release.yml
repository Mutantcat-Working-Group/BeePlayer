name: Release BeePlayer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build (must already exist, e.g. v1.0.YYYYMMDD)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VLC_CONTRIB_SHA_WIN64: 3e5d7492a6294993419e997c8ac0ca8ae5746d94
  VLC_CONTRIB_SHA_MACOS: c849f94b74dffc2fd21331bc86b72b508180d9dc

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and version
        id: resolve
        run: |
          set -euxo pipefail
          TAG="${{ github.event.inputs.tag || '' }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1 || \
            { echo "Tag '${TAG}' not found" >&2; exit 1; }
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ]; then
            echo "Expected a v* tag, got '${TAG}'" >&2
            exit 1
          fi
          case "$VERSION" in
            *-*)
              echo "Version '${VERSION}' must not contain a '-N' suffix (e.g. -1, -2)." >&2
              echo "Use the next date instead, e.g. 1.0.20260925, 1.0.20260926." >&2
              exit 1
              ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows NSIS (x86_64)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.tag }}

      - name: Build and package BeePlayer
        run: |
          set -euxo pipefail
          CONTRIB_SHA="${{ env.VLC_CONTRIB_SHA_WIN64 }}"
          PREBUILT_URL="https://artifacts.videolan.org/vlc/win64/vlc-contrib-x86_64-w64-mingw32-${CONTRIB_SHA}.tar.zst"
          docker run --rm \
           --user 0 \
           --workdir "${{ github.workspace }}" \
           -v "${{ github.workspace }}:${{ github.workspace }}" \
           -e VLC_PREBUILT_CONTRIBS_URL="${PREBUILT_URL}" \
           registry.videolan.org/vlc-debian-win64-posix:20260611225331 \
           /bin/sh -c "git config --global --add safe.directory \"${{ github.workspace }}\" && extras/package/win32/build.sh -a x86_64 -r -p"

      - name: Verify installer artifact
        run: |
          set -euxo pipefail
          INSTALLER="$(find . -maxdepth 3 -name 'BeePlayer-*-win64.exe' -print -quit)"
          if [ -z "${INSTALLER}" ]; then
            echo "NSIS installer was not produced" >&2
            find . -maxdepth 4 -name '*.exe' -print
            exit 1
          fi
          cp "${INSTALLER}" "BeePlayer-${VERSION}-win64.exe"
          ls -lh "BeePlayer-${VERSION}-win64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: BeePlayer-${{ env.VERSION }}-win64.exe
          path: BeePlayer-${{ env.VERSION }}-win64.exe
          if-no-files-found: error

  macos-intel:
    name: macOS DMG (x86_64, ad-hoc)
    needs: version
    runs-on: macos-15-intel
    timeout-minutes: 360
    env:
      VERSION: ${{ needs.version.outputs.version }}
      VLC_FORCE_KERNELVERSION: '19'
      VLC_CONFIGURE_ARGS: --disable-sparkle
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.tag }}

      - name: Build and package BeePlayer
        env:
          VLC_PREBUILT_CONTRIBS_URL: https://artifacts.videolan.org/vlc/macos-x86_64/vlc-contrib-x86_64-apple-darwin19-${{ env.VLC_CONTRIB_SHA_MACOS }}.tar.zst
        run: |
          set -euxo pipefail
          # dmgbuild gives the styled DMG; when unavailable the package target
          # falls back to a plain hdiutil DMG, so failures here are non-fatal.
          python3 -m pip install --user --upgrade dmgbuild || true
          export PATH="$HOME/Library/Python/3.*/bin:$PATH"
          extras/package/macosx/build.sh -i n -a x86_64 -j "$(getconf NPROCESSORS_ONLN)"

      - name: Rename and verify DMG
        run: |
          set -euxo pipefail
          test -f "BeePlayer-${VERSION}.dmg"
          cp "BeePlayer-${VERSION}.dmg" "BeePlayer-${VERSION}-macos-x86_64.dmg"
          hdiutil verify "BeePlayer-${VERSION}-macos-x86_64.dmg"
          ls -lh "BeePlayer-${VERSION}-macos-x86_64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: BeePlayer-${{ env.VERSION }}-macos-x86_64.dmg
          path: BeePlayer-${{ env.VERSION }}-macos-x86_64.dmg
          if-no-files-found: error

  macos-arm64:
    name: macOS DMG (arm64, ad-hoc)
    needs: version
    runs-on: macos-15
    timeout-minutes: 360
    env:
      VERSION: ${{ needs.version.outputs.version }}
      VLC_FORCE_KERNELVERSION: '19'
      VLC_CONFIGURE_ARGS: --disable-sparkle
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.tag }}

      - name: Build and package BeePlayer
        env:
          VLC_PREBUILT_CONTRIBS_URL: https://artifacts.videolan.org/vlc/macos-arm64/vlc-contrib-aarch64-apple-darwin19-${{ env.VLC_CONTRIB_SHA_MACOS }}.tar.zst
        run: |
          set -euxo pipefail
          python3 -m pip install --user --upgrade dmgbuild || true
          export PATH="$HOME/Library/Python/3.*/bin:$PATH"
          extras/package/macosx/build.sh -i n -a aarch64 -j "$(getconf NPROCESSORS_ONLN)"

      - name: Rename and verify DMG
        run: |
          set -euxo pipefail
          test -f "BeePlayer-${VERSION}.dmg"
          cp "BeePlayer-${VERSION}.dmg" "BeePlayer-${VERSION}-macos-arm64.dmg"
          hdiutil verify "BeePlayer-${VERSION}-macos-arm64.dmg"
          ls -lh "BeePlayer-${VERSION}-macos-arm64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: BeePlayer-${{ env.VERSION }}-macos-arm64.dmg
          path: BeePlayer-${{ env.VERSION }}-macos-arm64.dmg
          if-no-files-found: error

  linux-appimage:
    name: Linux AppImage (x86_64)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 600
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.tag }}

      - name: Download linuxdeploy tools
        run: |
          set -euxo pipefail
          mkdir -p "${RUNNER_TEMP}/linuxdeploy"
          curl -fsSL -o "${RUNNER_TEMP}/linuxdeploy/linuxdeploy" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o "${RUNNER_TEMP}/linuxdeploy/linuxdeploy-plugin-qt" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x "${RUNNER_TEMP}/linuxdeploy"/*

      - name: Build, install and package BeePlayer AppImage
        run: |
          set -euxo pipefail
          mkdir -p /tmp/appdir
          docker run --rm \
            --user 0 \
            --workdir "${{ github.workspace }}" \
            -v "${{ github.workspace }}:${{ github.workspace }}" \
            -v /tmp/appdir:/tmp/appdir \
            -v "${RUNNER_TEMP}/linuxdeploy:/linuxdeploy:ro" \
            registry.videolan.org/vlc-debian-unstable:20260611225331 \
            /bin/sh -euxc '
              export NCPU="$(getconf _NPROCESSORS_ONLN)"

              # linuxdeploy needs these tools on the build host.
              apt-get update -qq
              apt-get install -y --no-install-recommends patchelf desktop-file-utils

              # Official VLC debian CI also builds directly against the
              # system libraries provided by this image.
              git config --global --add safe.directory "${{ github.workspace }}"
              ./bootstrap
              ./configure --prefix=/usr
              make -j"${NCPU}"

              find /tmp/appdir -mindepth 1 -maxdepth 1 -exec rm -rf {} +
              make install DESTDIR=/tmp/appdir

              DESKTOP_FILE="$(find /tmp/appdir/usr/share/applications -maxdepth 1 -name "vlc.desktop" -print -quit)"
              test -n "${DESKTOP_FILE}"
              sed -i "s/^Icon=.*/Icon=beeplayer/" "${DESKTOP_FILE}"
              install -Dm644 share/vlc512x512.png \
                /tmp/appdir/usr/share/icons/hicolor/512x512/apps/beeplayer.png

              export APPIMAGE_EXTRACT_AND_RUN=1
              export ARCH=x86_64
              export QMAKE="$(command -v qmake6 || command -v qmake)"
              test -x "${QMAKE}"

              # The installed vlc binary has no RPATH, so the linuxdeploy
              # ldd pass must resolve libraries inside the AppDir.
              export LD_LIBRARY_PATH="/tmp/appdir/usr/lib:/tmp/appdir/usr/lib/beeplayer${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

              /linuxdeploy/linuxdeploy \
                --appdir /tmp/appdir \
                --desktop-file "${DESKTOP_FILE}" \
                --icon-file /tmp/appdir/usr/share/icons/hicolor/512x512/apps/beeplayer.png \
                --plugin qt \
                --output appimage
            '

      - name: Rename and verify AppImage
        run: |
          set -euxo pipefail
          APPIMAGE_FILE="$(find . -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "${APPIMAGE_FILE}"
          cp "${APPIMAGE_FILE}" "BeePlayer-${VERSION}-linux-x86_64.AppImage"
          chmod +x "BeePlayer-${VERSION}-linux-x86_64.AppImage"
          ls -lh "BeePlayer-${VERSION}-linux-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: BeePlayer-${{ env.VERSION }}-linux-x86_64.AppImage
          path: BeePlayer-${{ env.VERSION }}-linux-x86_64.AppImage
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [version, windows, macos-intel, macos-arm64, linux-appimage]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-assets

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd release-assets
          files=(*)
          sha256sum "${files[@]}" > checksums.txt
          md5sum "${files[@]}" > checksums-md5.txt
          sha1sum "${files[@]}" > checksums-sha1.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: BeePlayer ${{ env.VERSION }}
          body: |
            BeePlayer ${{ env.VERSION }} release.

            - Windows: NSIS installer (`BeePlayer-${{ env.VERSION }}-win64.exe`)
            - macOS Intel: ad-hoc signed DMG (`BeePlayer-${{ env.VERSION }}-macos-x86_64.dmg`)
            - macOS Apple Silicon: ad-hoc signed DMG (`BeePlayer-${{ env.VERSION }}-macos-arm64.dmg`)
            - Linux: AppImage (`BeePlayer-${{ env.VERSION }}-linux-x86_64.AppImage`)

            The macOS packages are ad-hoc signed; without a Developer ID
            certificate Gatekeeper may require right-click -> Open on first run.
          files: release-assets/*
          fail_on_unmatched_files: true
