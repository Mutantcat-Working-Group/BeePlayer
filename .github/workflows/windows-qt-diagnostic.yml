name: Windows cross toolchain diagnostic

on:
  workflow_dispatch:

jobs:
  wine:
    name: Check Wine execution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image:
          - registry.videolan.org/vlc-debian-win64-posix:20260611225331
          - registry.videolan.org/vlc-debian-llvm-msvcrt:20260611225331
    steps:
      - uses: actions/checkout@v4

      - name: Compile and run a minimal Windows executable
        run: |
          set -ux
          docker run --rm \
            --user 0 \
            -e WINEDEBUG=+warn \
            "${{ matrix.image }}" \
            /bin/sh -uxc '
              echo "IMAGE_TOOLS"
              command -v wine || true
              command -v wine64 || true
              wine --version || true
              echo "COMPILER_ENV"
              env | grep -E "^(CC|CXX|PATH|WINE)" | sort || true
              CC="${CC:-x86_64-w64-mingw32-gcc}"
              printf "int main(void) { return 42; }\n" > /tmp/check.c
              "$CC" /tmp/check.c -o /tmp/check.exe
              file /tmp/check.exe
              set +e
              wine /tmp/check.exe
              status=$?
              echo "wine_status=$status"
              wine64 /tmp/check.exe
              status64=$?
              echo "wine64_status=$status64"
              exit 0
            '
